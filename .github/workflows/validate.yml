name: Validate

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Empty token scopes make checkout report "repository not found" and hacs/action
# die with "invalid_token" before any integration checks run.
permissions:
  contents: read

jobs:
  tests:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  about:
    name: repository about
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set GitHub description and topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='Home Assistant custom integration for Evaplex devices'
          printf '%s\n' '{"names":["home-assistant","hacs","custom-component","integration"]}' \
            | gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" --input -

  hacs:
    name: HACS
    needs: [about]
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          github_token: ${{ github.token }}
          comment: false
          # Brand icons land via home-assistant/brands. Drop this ignore after that PR merges.
          ignore: brands
