[project]
name = "evaplex-iot-hacs"
version = "0.1.2"
description = "Evaplex custom integration for Home Assistant"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiohttp>=3.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["custom_components", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = [
    "custom_components/evaplex/api",
    "custom_components/evaplex/application",
    "scripts",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "custom_components",
    "custom_components.evaplex",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
